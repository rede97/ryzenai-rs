[package]
name = "ai-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
image = "0.25.5"
log = "0.4.26"
ndarray = "0.16.1"
sdl3 = "0.14.15"
sdl3-sys = { version = "0.4.6", features = ["debug-impls"] }
sdl3-ttf-sys = "0.1.0"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.60.0", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
] }
